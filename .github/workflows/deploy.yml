name: deploy

# 手動実行（ダイヤ改正時など）。合言葉は Secrets の PASSPHRASE に置く。
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 暗号化して置いた駅データ.jp の CSV を戻し、ODPT の時刻表（Secrets の ODPT_KEY があれば）を取って、
      # ODPT にある路線は本物の時刻、ほかは概算ダイヤで作る。CSV（data/ekidata.enc）が無いときはダミーデータで公開する。
      - name: データ作成
        run: |
          if [ -f data/ekidata.enc ]; then
            npm run csv:unpack
            if [ -n "$ODPT_KEY" ]; then npm run odpt:fetch; fi
            npm run build:beta
          else
            npm run build
          fi
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          ODPT_KEY: ${{ secrets.ODPT_KEY }}
      - name: 合言葉でデータを暗号化
        run: npm run encrypt
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
